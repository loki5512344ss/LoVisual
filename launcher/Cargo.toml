[package]
name = "lovisual-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "LoVisual launcher: login, dashboard, Minecraft launch"
license = "GPL-3.0"

[dependencies]
slint = "1.17"
tokio = { version = "1.53", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "rustls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "6"

[build-dependencies]
slint-build = "1.17"

[lints.rust]
dead_code = "deny"

[lints.clippy]
correctness = "deny"
suspicious = "deny"
style = "deny"
complexity = "deny"
perf = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
